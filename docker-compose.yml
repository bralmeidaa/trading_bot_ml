services:
  trading-bot-v2:
    image: bralmeida/trading-bot-ml-v2:latest
    container_name: trading-bot-master-v2
    ports:
      - "12001:12000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
        #volumes:
      #  - trading-bot-logs:/app/logs
        #  - trading-bot-data:/app/data
        #  - trading-bot-config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - trading-network-v2

# Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: trading-bot-nginx-v2
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./fullchainCert.pem:/etc/nginx/ssl/fullchainCert.pem:ro
      - ./privateKey.pem:/etc/nginx/ssl/privateKey.pem:ro
    depends_on:
      - trading-bot-v2
    restart: unless-stopped
    networks:
      - trading-network-v2

networks:
  trading-network-v2:
    driver: bridge    
