services:
  trading-bot:
    image: bralmeida/trading-bot-ml:latest
    container_name: trading-bot-master
    ports:
      - "12000:12000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
        #volumes:
      #  - trading-bot-logs:/app/logs
        #  - trading-bot-data:/app/data
        #  - trading-bot-config:/app/config
    restart: unless-stopped
    deploy:
      resources:
        # VM: 2 ARM cores / 16G RAM, NO swap. ML pre-training (365d of 1m
        # candles + walk-forward) spikes memory well past 1G — with no swap
        # that = instant OOM kill + restart. Give generous headroom.
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12000/api/health"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - trading-network

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    networks:
      - trading-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: trading-bot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./fullchainCert.pem:/etc/nginx/ssl/fullchainCert.pem:ro
      - ./privateKey.pem:/etc/nginx/ssl/privateKey.pem:ro
    depends_on:
      - trading-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    networks:
      - trading-network

volumes:
  redis_data:

networks:
  trading-network:
    driver: bridge
