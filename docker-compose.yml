services:
  trading-bot:
    image: bralmeida/trading-bot-ml:latest
    container_name: trading-bot-master
    ports:
      - "12000:12000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      # Auto-launch on boot (set to 0 to disable). Collector accumulates order
      # book history; portfolio runs the validated daily cross-sectional engine.
      - AUTOSTART_COLLECTOR=${AUTOSTART_COLLECTOR:-1}
      - AUTOSTART_PORTFOLIO=${AUTOSTART_PORTFOLIO:-1}
      - COLLECTOR_INTERVAL_SEC=${COLLECTOR_INTERVAL_SEC:-60}
      - COLLECTOR_DIR=/app/orderbook_data
    volumes:
      # Persist collected order book history across redeploys. HOST BIND MOUNT
      # (not a Docker volume) so it survives the CI/CD's aggressive
      # `down -v` + `system prune --volumes` cleanup. Host dir owned by ubuntu
      # (uid 1000) = tradingbot in the container → writable.
      - ./orderbook_data:/app/orderbook_data
    restart: unless-stopped
    deploy:
      resources:
        # VM: 2 ARM cores / 16G RAM, NO swap. ML pre-training (365d of 1m
        # candles + walk-forward) spikes memory well past 1G — with no swap
        # that = instant OOM kill + restart. Give generous headroom.
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12000/api/health"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - trading-network

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: trading-bot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    networks:
      - trading-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: trading-bot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./fullchainCert.pem:/etc/nginx/ssl/fullchainCert.pem:ro
      - ./privateKey.pem:/etc/nginx/ssl/privateKey.pem:ro
    depends_on:
      - trading-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    networks:
      - trading-network

volumes:
  redis_data:

networks:
  trading-network:
    driver: bridge
