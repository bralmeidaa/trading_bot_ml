events {
    worker_connections 1024;
}

http {
    # Was missing: without this, nginx serves every static file (CSS/JS/
    # fonts/images on the CIE sites) as text/plain, and the
    # X-Content-Type-Options: nosniff header below then makes browsers
    # refuse to apply/execute them — the page loses all styling.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream trading_bot {
        server trading-bot:12000;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dashboard:10m rate=5r/s;

    # CIE site(s) moved to Azure Blob static hosting (2026-10) — removed
    # from here. This VM/nginx now only serves the trading bot.

    server {
        listen 80;
        listen [::]:80;
        server_name trading.bratech.me;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name trading.bratech.me;

        # SSL via certbot (Let's Encrypt, HTTP-01, auto-renewed by certbot.timer)
        # — managed by `certbot --nginx`, do not hand-edit these two paths.
        ssl_certificate /etc/letsencrypt/live/trading.bratech.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/trading.bratech.me/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Dashboard
        location / {
            limit_req zone=dashboard burst=10 nodelay;
            proxy_pass http://trading_bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://trading_bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React build assets — Vite generates /assets/... paths in index.html
        # Must be declared before the catch-all location /
        location /assets/ {
            proxy_pass http://trading_bot;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Legacy static files
        location /static/ {
            proxy_pass http://trading_bot;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Health check
        location /health {
            proxy_pass http://trading_bot/api/health;
            access_log off;
        }
    }
}
