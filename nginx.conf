events {
    worker_connections 1024;
}

http {
    # Was missing: without this, nginx serves every static file (CSS/JS/
    # fonts/images on the CIE sites) as text/plain, and the
    # X-Content-Type-Options: nosniff header below then makes browsers
    # refuse to apply/execute them — the page loses all styling.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream trading_bot {
        server trading-bot:12000;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dashboard:10m rate=5r/s;

    server {
        listen 80;
        listen [::]:80;
        server_name trading.braatech.xyz;
        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name carteirinha.orgbr.braatech.xyz validacao.estudante.orgbr.braatech.xyz;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name carteirinha.orgbr.braatech.xyz;

        ssl_certificate /etc/nginx/ssl/cie-fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/cie-privatekey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        root /var/www/CIE;
        index index.html;

        # Browser "save page" renamed cross-origin scripts to *.js.download;
        # the .download suffix isn't a known MIME extension so it would
        # otherwise fall back to default_type and get blocked by nosniff.
        location ~* \.js\.download$ {
            default_type application/javascript;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name validacao.estudante.orgbr.braatech.xyz;

        ssl_certificate /etc/nginx/ssl/cie-fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/cie-privatekey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        root /var/www/CIE/validador;
        index index.html;

        # Shared Next.js font/asset cache (absolute /_next/static/... refs
        # embedded in the saved page point outside the validador/ root).
        location /_next/static/ {
            alias /var/www/CIE/_next/static/;
        }

        # Browser "save page" renamed cross-origin scripts to *.js.download;
        # the .download suffix isn't a known MIME extension so it would
        # otherwise fall back to default_type and get blocked by nosniff.
        location ~* \.js\.download$ {
            default_type application/javascript;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name trading.braatech.xyz;

        # SSL Configurations
        ssl_certificate /etc/nginx/ssl/fullchainCert.pem;
        ssl_certificate_key /etc/nginx/ssl/privateKey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Dashboard
        location / {
            limit_req zone=dashboard burst=10 nodelay;
            proxy_pass http://trading_bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://trading_bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React build assets — Vite generates /assets/... paths in index.html
        # Must be declared before the catch-all location /
        location /assets/ {
            proxy_pass http://trading_bot;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Legacy static files
        location /static/ {
            proxy_pass http://trading_bot;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Health check
        location /health {
            proxy_pass http://trading_bot/api/health;
            access_log off;
        }
    }
}
