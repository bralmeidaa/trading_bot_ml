# Azure DevOps Pipeline for Trading Bot ML
# Deploy to OCI VM with Docker

# trigger:
#   branches:
#     include:
#     - main
#     - develop
#   paths:
#     exclude:
#     - README.md
#     - docs/*

pool:
  name: 'trading-bot-ml-vm'

variables:
  # Azure DevOps Variables (set in pipeline variables)
  deploymentPath: '/opt/trading-bot-ml'
  registryUrl: 'docker.io'
  imageRepository: 'bralmeida/trading-bot-ml'
  dockerImageTag: '$(Build.BuildId)'
  dockerImageLatestTag: 'latest'
  dockerImageCacheTag: 'cache'
  dockerfilePath: './Dockerfile'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: BuildJob
    displayName: 'Build Docker Image'
    
    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - task: Bash@3
      displayName: 'Turn Off and CleanUp Docker Container Images'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(deploymentPath)'
        script: | 
          sudo docker compose down --rmi all

          sudo docker system prune -f

    - task: Bash@3
      displayName: 'Clean deployment folder'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(deploymentPath)'
        script: | 
          sudo rm -r /opt/trading-bot-ml/* || true

          sudo rm -r /opt/trading_bot_ml || true

    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)'
        Contents: |
          **/*
          !.git/**/*
          !**/*.md
          !**/*.*ignore
        TargetFolder: '$(deploymentPath)'
        CleanTargetFolder: false
        OverWrite: true
        ignoreMakeDirErrors: true

    - task: Docker@2
      displayName: 'Docker Login'
      inputs:
        containerRegistry: 'docker-account-bralmeida'
        command: 'login'

    - task: Bash@3
      displayName: 'Build image with Buildx'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(deploymentPath)'
        script: | 
          set -e

          sudo docker buildx build \
          --platform linux/arm64 \
          --tag '$(imageRepository):$(dockerImageLatestTag)' \
          --file $(dockerfilePath) \
          --cache-from type=registry,ref=$(registryUrl)/$(imageRepository):dockerImageCacheTag \
          --cache-to "type=registry,ref=$(registryUrl)/$(imageRepository):dockerImageCacheTag,mode=max" \
          --push .

    - task: Docker@2
      displayName: 'Docker Logout'
      inputs:
        containerRegistry: 'docker-account-bralmeida'
        command: 'logout'

- stage: Deploy
  displayName: 'Deploy to OCI VM'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToOCI
    displayName: 'Deploy to OCI VM'
    environment: 'production'  
    strategy:
      runOnce:
        deploy:
          steps:  
          - task: Bash@3
            displayName: 'Setting up the .env'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(deploymentPath)'
              script: | 
                echo "🔧 Setting up environment..."
                # Create .env file with secrets
                cat > .env <<EOL
                BINANCE_API_KEY=$(BINANCE_API_KEY)
                BINANCE_API_SECRET=$(BINANCE_API_SECRET)
                ENVIRONMENT=production
                BUILD_ID=$(dockerImageLatestTag)
                EOL

          - task: Bash@3
            displayName: 'Docker Compose Deploy'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(deploymentPath)'
              script: | 
                set -e
                
                echo "🚀 Starting new containers..."
                sudo docker compose up -d
                  
                echo "⏳ Waiting for services to start..."
                sleep 30

                echo "Look the running containers"
                sudo docker compose ps
                
                echo "✅ Deployment completed successfully!"

          - task: Bash@3
            displayName: 'Verify Application Status'
            inputs:
              targetType: 'inline'
              script: | 
                echo "🔍 Verifying deployment..."
                
                # Test API endpoint
                response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:12000/api/health || echo "000")
                
                if [ $response -eq 200 ]; then
                  echo "✅ API health check passed"
                else
                  echo "❌ API health check failed (HTTP $response)"
                  exit 1
                fi
                
                # Test dashboard
                response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:12000/)
                
                if [ $response -eq 200 ]; then
                  echo "✅ Dashboard is accessible"
                else
                  echo "❌ Dashboard is not accessible (HTTP $response)"
                  exit 1
                fi
                
                echo "🎉 All verification checks passed!"
                echo "📊 Dashboard URL: http://localhost:12000"

