# Azure DevOps Pipeline for Trading Bot ML
# Build on a Microsoft-hosted agent, deploy over SSH to the Hetzner VM.
#
# Rewritten 2026-10-29 after losing the old self-hosted-agent VM (OCI free
# tier ARM instance, reclaimed by Oracle's June/2026 Always-Free cut). The
# self-hosted agent used to run ON that VM, so when it died, CI/CD died with
# it. Decoupling build/deploy from the app host's lifecycle is the fix —
# a lost/replaced VM no longer takes the pipeline down with it.
#
# New host: Hetzner Cloud VM (trading.bratech.me), ARM64 (aarch64), so the
# image is still built for linux/arm64 — just via QEMU emulation on the
# Microsoft-hosted x86 runner now (no GA ARM64-hosted Linux pool exists in
# Azure Pipelines as of Oct/2026), instead of natively like the old self-
# hosted ARM agent used to.
#
# TLS is no longer handled by this pipeline: certbot (Let's Encrypt) runs
# directly on the VM with its own systemd renewal timer. The old ZeroSSL
# DownloadSecureFile steps are gone.

# trigger:
#   branches:
#     include:
#     - main
#     - develop
#   paths:
#     exclude:
#     - README.md
#     - docs/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: trading-bot-vg
  - name: deploymentPath
    value: '/opt/trading-bot-ml'
  - name: registryUrl
    value: 'docker.io'
  - name: imageRepository
    value: 'bralmeida/trading-bot-ml'
  - name: dockerImageLatestTag
    value: 'latest'
  - name: dockerfilePath
    value: './Dockerfile'
  - name: sshEndpoint
    value: 'hetzner-trading-vm'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: BuildJob
    displayName: 'Build Docker Image'

    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - task: Docker@2
      displayName: 'Docker Login'
      inputs:
        containerRegistry: 'docker-account-bralmeida'
        command: 'login'

    - task: Bash@3
      displayName: 'Build image with Buildx (arm64 via QEMU)'
      inputs:
        targetType: 'inline'
        script: |
          set -e

          echo "🧩 Registering QEMU binfmt handlers for cross-arch emulation..."
          docker run --rm --privileged tonistiigi/binfmt --install arm64

          echo "🏗️ Creating a buildx builder with multi-platform support..."
          docker buildx create --use --name multiarch-builder || docker buildx use multiarch-builder

          echo "🔨 Building for linux/arm64 (target VM is Hetzner ARM, aarch64)..."
          docker buildx build \
          --platform linux/arm64 \
          --tag '$(imageRepository):$(dockerImageLatestTag)' \
          --file $(dockerfilePath) \
          --no-cache \
          --push .

          echo "✅ Docker image built and pushed successfully!"

    - task: Docker@2
      displayName: 'Docker Logout'
      inputs:
        containerRegistry: 'docker-account-bralmeida'
        command: 'logout'

- stage: Deploy
  displayName: 'Deploy'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployApp
    displayName: 'Deploy App'
    environment: 'pre-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: 'Checkout source code'

          - task: CopyFilesOverSSH@0
            displayName: 'Copy docker-compose.yml to the VM'
            inputs:
              sshEndpoint: '$(sshEndpoint)'
              sourceFolder: '$(Pipeline.Workspace)/s'
              contents: 'docker-compose.yml'
              targetFolder: '$(deploymentPath)'
              overwriteExisting: true
              failOnEmptySource: true
            # nginx.conf in the repo is the container-oriented reference copy
            # (kept for docs/history). The LIVE site config is a host file,
            # /etc/nginx/conf.d/trading-bot.conf, edited directly over SSH
            # when it changes — not auto-synced by this pipeline (deliberate,
            # to avoid silently overwriting a hand-tuned host config with a
            # differently-shaped file). Revisit if this becomes a recurring
            # change; for now it's rare enough to do by hand.

          - task: SSH@0
            displayName: 'Render .env on the VM'
            inputs:
              sshEndpoint: '$(sshEndpoint)'
              runOptions: 'inline'
              inline: |
                set -e
                cat > $(deploymentPath)/.env <<'EOL'
                ENVIRONMENT=production
                SMTP_HOST=$(SMTP_HOST)
                SMTP_PORT=$(SMTP_PORT)
                SMTP_USER=$(SMTP_USER)
                SMTP_PASS=$(SMTP_PASS)
                ALERT_TO=$(ALERT_TO)
                AZURE_AI_FOUNDRY_ENDPOINT=$(AZURE_AI_FOUNDRY_ENDPOINT)
                AZURE_AI_FOUNDRY_API_KEY=$(AZURE_AI_FOUNDRY_API_KEY)
                AZURE_AI_FOUNDRY_DEPLOYMENT=$(AZURE_AI_FOUNDRY_DEPLOYMENT)
                EOL
                chmod 600 $(deploymentPath)/.env
                echo "✅ .env written"

          - task: SSH@0
            displayName: 'Docker Compose Deploy + nginx reload'
            inputs:
              sshEndpoint: '$(sshEndpoint)'
              runOptions: 'inline'
              inline: |
                set -e
                cd $(deploymentPath)

                echo "📁 Ensuring persistent host data dirs (outside deploy dir, owned by container uid 1000)..."
                mkdir -p /opt/trading-bot-data/orderbook_data /opt/trading-bot-data/db
                chown -R 1000:1000 /opt/trading-bot-data

                echo "🔄 Pulling latest image..."
                docker compose pull

                echo "🚀 Starting new container with fresh image..."
                docker compose up -d --force-recreate --remove-orphans

                echo "🧹 Light cleanup (unused images only, never volumes/running containers)..."
                docker image prune -f || true

                echo "🔧 Sanity-check + reload the host nginx (site config lives in /etc/nginx/conf.d, managed separately)..."
                nginx -t && systemctl reload nginx || true

                echo "⏳ Waiting for the app to come up..."
                sleep 15
                docker compose ps
                docker compose logs --tail=20

                echo "✅ Deployment completed successfully!"

- stage: Testing
  displayName: 'App validation'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: URLValidation
    displayName: 'Validate the App URLs'
    steps:
          - task: Bash@3
            displayName: 'Verify Deployment (public HTTPS endpoint)'
            inputs:
              targetType: 'inline'
              script: |
                echo "🔍 Verifying deployment via https://trading.bratech.me ..."

                response=$(curl -s -o /dev/null -w "%{http_code}" https://trading.bratech.me/api/health || echo "000")
                if [ "$response" -eq 200 ]; then
                  echo "✅ API health check passed"
                else
                  echo "❌ API health check failed (HTTP $response)"
                  exit 1
                fi

                response=$(curl -s -o /dev/null -w "%{http_code}" https://trading.bratech.me/)
                if [ "$response" -eq 200 ]; then
                  echo "✅ Dashboard is accessible"
                  # The app auto-starts collector + AI agent on boot (startup hook).
                  # Explicit call is belt-and-suspenders (idempotent) — the AGENT is
                  # the active paper strategy now, not the cross-sectional portfolio.
                  curl -fsS -X POST https://trading.bratech.me/api/collector/start || true
                  curl -fsS -X POST https://trading.bratech.me/api/agent/start || true
                else
                  echo "❌ Dashboard is not accessible (HTTP $response)"
                  exit 1
                fi

                echo "🎉 All verification checks passed!"
                echo "📊 Dashboard URL: https://trading.bratech.me"

- stage: InitialTShoot
  displayName: 'InitialTShoot'
  dependsOn: Testing
  condition: failed()
  jobs:
  - job: RollbackJob
    displayName: 'Diagnose Deployment Failure'
    steps:
    - task: SSH@0
      displayName: 'Remote troubleshooting (on the VM)'
      inputs:
        sshEndpoint: '$(sshEndpoint)'
        runOptions: 'inline'
        inline: |
          cd $(deploymentPath)
          echo "📊 Docker system status:"; docker system df
          echo "📋 Current containers:"; docker compose ps -a
          echo "📝 Container logs (last 50 lines):"; docker compose logs --tail=50
          echo "🌐 Local health check:"; curl -v http://127.0.0.1:12000/api/health || echo "Health check failed"
          echo "🧾 nginx status:"; systemctl status nginx --no-pager | head -10
