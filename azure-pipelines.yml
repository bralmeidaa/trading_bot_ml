# Azure DevOps Pipeline for Trading Bot ML
# Deploy to OCI VM with Docker

# trigger:
#   branches:
#     include:
#     - main
#     - develop
#   paths:
#     exclude:
#     - README.md
#     - docs/*

pool:
  name: 'trading-bot-ml-vm'

variables:
  # Azure DevOps Variables (set in pipeline variables)
  deploymentPath: '/opt/trading-bot-ml'
  registryUrl: 'docker.io'
  imageRepository: 'bralmeida/trading-bot-ml'
  dockerImageTag: '$(Build.BuildId)'
  dockerImageLatestTag: 'latest'
  dockerImageCacheTag: 'cache'
  dockerfilePath: './Dockerfile'
  fullchain_serverCertificatePath: '$(System.DefaultWorkingDirectory)/fullchain_serverCertificate.crt'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: BuildJob
    displayName: 'Build Docker Image'
    
    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - task: Bash@3
      displayName: 'Turn Off and CleanUp Docker Container Images'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(deploymentPath)'
        script: | 
          echo "🛑 Stopping and removing containers with verbose output..."
          docker compose down --rmi all -v || true
          
          echo "🧹 Aggressive Docker cleanup..."
          docker system prune -af --volumes
          
          echo "🗑️ Removing dangling images and build cache..."
          docker builder prune -af || true
          
          echo "📊 Docker system info after cleanup:"
          docker system df

    - task: Bash@3
      displayName: 'Clean deployment folder'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(deploymentPath)'
        script: | 
          echo "🧹 Cleaning deployment folder with verbose output..."
          sudo rm -rv /opt/trading-bot-ml/* || true

          sudo rm -rv /opt/trading_bot_ml || true
          
          echo "📁 Creating fresh deployment directory..."
          sudo mkdir -p /opt/trading-bot-ml
          sudo chown -R $(whoami):$(whoami) /opt/trading-bot-ml

    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)'
        Contents: |
          **/*
          !.git/**/*
          !**/*.md
          !**/*.*ignore
        TargetFolder: '$(deploymentPath)'
        CleanTargetFolder: false
        OverWrite: true
        ignoreMakeDirErrors: true

    - task: Docker@2
      displayName: 'Docker Login'
      inputs:
        containerRegistry: 'docker-account-bralmeida'
        command: 'login'

    - task: Bash@3
      displayName: 'Build image with Buildx'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(deploymentPath)'
        script: | 
          set -e
          
          echo "🔨 Building Docker image with no cache to ensure fresh build..."
          echo "📂 Current directory contents:"
          ls -la

          echo "🏗️ Building image for platform linux/arm64..."
          docker buildx build \
          --platform linux/arm64 \
          --tag '$(imageRepository):$(dockerImageLatestTag)' \
          --file $(dockerfilePath) \
          --no-cache \
          --pull \
          --push .
          
          echo "✅ Docker image built and pushed successfully!"
          echo "🏷️ Image tag: $(imageRepository):$(dockerImageLatestTag)"

    - task: Docker@2
      displayName: 'Docker Logout'
      inputs:
        containerRegistry: 'docker-account-bralmeida'
        command: 'logout'

- stage: Deploy
  displayName: 'Deploy'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployApp
    displayName: 'Deploy App'
    environment: 'pre-production'  
    strategy:
      runOnce:
        deploy:
          steps:  
          - task: DownloadSecureFile@1
            name: 'serverCertificate'
            displayName: 'Downloading Certificate File'
            inputs:
              secureFile: 'trading_braatech_xyz.pem'

          - task: DownloadSecureFile@1
            name: 'privateKey'
            displayName: 'Downloading Private Key File'
            inputs:
              secureFile: 'trading_braatech_xyz_key.pem'

          - task: DownloadSecureFile@1
            name: 'caCertificate'
            displayName: 'Downloading CA Certificate File'
            inputs:
              secureFile: 'zerossl_ca_bundle.pem'
        
          - task: Bash@3
            displayName: 'Combine SSL Certs and Set env variables'
            inputs:
              workingDirectory: '$(deploymentPath)'
              targetType: 'inline'
              script: | 
                sudo rm -rf *.pem || true

                sudo cat $(serverCertificate.secureFilePath) $(caCertificate.secureFilePath) > ./fullchainCert.pem

                #copy private key secure file
                sudo cp -p --verbose $(privateKey.secureFilePath) ./privateKey.pem

                #Create env file with secrets
                echo "🔧 Setting up environment..."
                cat > .env <<'EOL'
                BINANCE_API_KEY=$(BINANCE_API_KEY)
                BINANCE_API_SECRET=$(BINANCE_API_SECRET)
                ENVIRONMENT=production
                BUILD_ID=$(dockerImageLatestTag)
                EOL

                #Check .env creation
                ls -la .env

          - task: Bash@3
            displayName: 'Docker Compose Deploy'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(deploymentPath)'
              script: | 
                set -e
                
                echo "🔄 Pulling latest images..."
                docker compose pull

                echo "📁 Ensuring host data dir exists (bind mount for order book history)..."
                mkdir -p orderbook_data

                echo "🚀 Starting new containers with fresh images..."
                docker compose up -d --force-recreate --remove-orphans
                  
                echo "⏳ Waiting for services to start..."
                sleep 30

                echo "📋 Current running containers:"
                docker compose ps
                
                echo "📊 Container logs (last 20 lines):"
                docker compose logs --tail=20
                
                echo "✅ Deployment completed successfully!"

- stage: Testing
  displayName: 'App validation'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: URLValidation
    displayName: 'Valide the App URLs'
    steps:
          - task: Bash@3
            displayName: 'Verify Application Status'
            inputs:
              targetType: 'inline'
              script: | 
                echo "🔍 Verifying deployment..."
                
                # Test API endpoint
                response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:12000/api/health || echo "000")
                
                if [ $response -eq 200 ]; then
                  echo "✅ API health check passed"
                else
                  echo "❌ API health check failed (HTTP $response)"
                  exit 1
                fi
                
                # Test dashboard
                response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:12000/)
                
                if [ $response -eq 200 ]; then
                  echo "✅ Dashboard is accessible"
                  # The app auto-starts collector + portfolio on boot (startup hook).
                  # These explicit calls are belt-and-suspenders (idempotent).
                  curl -fsS -X POST http://localhost:12000/api/collector/start || true
                  curl -fsS -X POST http://localhost:12000/api/portfolio/start || true
                else
                  echo "❌ Dashboard is not accessible (HTTP $response)"
                  exit 1
                fi
                
                echo "🎉 All verification checks passed!"
                echo "📊 Dashboard URL: http://localhost:12000"

                # Test nginx

- stage: InitialTShoot
  displayName: 'InitialTShoot'
  dependsOn: Testing
  condition: failed()
  jobs:
  - job: RollbackJob
    displayName: 'Rollback to Previous Version'
    steps:
    - task: Bash@3
      displayName: 'Initial Troubleshooting Steps'
      inputs:   
        targetType: 'inline'
        workingDirectory: '$(deploymentPath)'
        script: | 
          set -e
          
          echo "🔍 Troubleshooting deployment failure..."
          
          echo "📊 Docker system status:"
          docker system df
          
          echo "📋 Current containers:"
          docker compose ps -a
          
          echo "📝 Container logs (last 50 lines):"
          docker compose logs --tail=50
          
          echo "🏗️ Image information:"
          docker images | grep trading-bot
          
          echo "🌐 Network connectivity test:"
          curl -v http://localhost:12000/api/health || echo "Health check failed"
