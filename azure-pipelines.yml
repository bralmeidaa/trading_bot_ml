  dockerImageName: 'trading-bot-ml'
  dockerImageTag: '$(Build.BuildId)'
  dockerImageLatestTag: 'latest'
  deploymentPath: '/opt/trading-bot-ml'
  registryUrl: 'registry-1.docker.io'
  imageRepository: 'bralmeida/trading-bot-ml'
  dockerfilePath: './Dockerfile'


stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: BuildJob
    displayName: 'Build Docker Image'
    # pool:
    #   vmImage: 'ubuntu-latest'
    
    steps:
    - checkout: self
      displayName: 'Checkout source code'
    
    # - task: DockerInstaller@0
    #   inputs:
    #     dockerVersion: '28.3.3'

    # - task: Docker@2
    #   displayName: 'Build & Push Docker image to repository'
    #   inputs:
    #     containerRegistry: 'docker-account-bralmeida'
    #     repository: 'bralmeida/trading-bot-ml'
    #     command: 'buildAndPush'
    #     Dockerfile: './Dockerfile'
    #     tags: |
    #       $(dockerImageTag)
    #       $(dockerImageLatestTag)

    # - task: bash
    #   displayName: 'Install Docker Buildx Plugin'
    #   inputs:
    #     targetType: 'inline'
    #     script: |
    #       set -e
    #       echo "Verificando/Instalando o plugin docker buildx..."
    #       BUILDX_VERSION=$(curl --silent "https://api.github.com/repos/docker/buildx/releases/latest" | grep -Po '"tag_name": "\K.*?(?=")')
    #       mkdir -p ~/.docker/cli-plugins
    #       curl -L "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" -o ~/.docker/cli-plugins/docker-buildx
    #       chmod +x ~/.docker/cli-plugins/docker-buildx
    #       echo "Verificação da instalação:"
    #       docker buildx version

    # VERSÃO NOVA (A SOLUÇÃO)
    - task: Bash@3
      displayName: 'Build and Push multi-arch image with Buildx'
      inputs:
        targetType: 'inline'
        script: |
          #Login no seu registro de container
          #(Use a forma de autenticação apropriada para sua pipeline)
          sudo echo $(DOCKER_LOGIN_TOKEN) | docker login -u $(DOCKER_LOGIN_USERNAME) --password-stdin

          #Habilita o buildx (QEMU é necessário para emular outras arquiteturas)
          sudo docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

          sudo docker buildx version

          #Cria e seleciona um builder do buildx
          sudo docker buildx create --use
          echo "Iniciando build para múltiplas arquiteturas..."

          #O comando principal: constrói para amd64 e arm64 e envia (--push)
          sudo docker buildx build \
            --platform linux/arm64 \
            --tag $(imageRepository):$(dockerImageLatestTag) \
            --file $(dockerfilePath) \
            . \
            --push

          sudo docker logout
    
    - task: CmdLine@2
      displayName: 'List Docker Images'
      inputs:
        script: 'sudo docker image ls'

    # - task: Docker@2
    #   displayName: 'Save Docker image'
