# Azure DevOps Pipeline for Trading Bot ML
# Deploy to OCI VM with Docker

# trigger:
#   branches:
#     include:
#     - main
#     - develop
#   paths:
#     exclude:
#     - README.md
#     - docs/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Azure DevOps Variables (set in pipeline variables)
  # - BINANCE_API_KEY: 'tdeQHHeCpf6C0eGYWNeE1LsxIOoZ5HHUUSgsHWD1V5aaest9CDPkf66HRiJPi3Lh' Binance API key (optional, for live trading)
  # - BINANCE_API_SECRET: 'XJcCVpNSi7AyzIW0VHSW6M1sfeUiBlG8KnFj4OkEJ86spJabBDKQkTjAhDXdv6OR' Binance API secret (optional, for live trading)
  dockerImageTag: '$(Build.BuildId)'
  dockerImageLatestTag: 'latest'
  deploymentPath: '/opt/trading-bot-ml'
  registryUrl: 'docker.io'
  imageRepository: 'bralmeida/trading-bot-ml'
  imageName: 'docker.io/bralmeida/trading-bot-ml'
  dockerfilePath: './Dockerfile'


stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: BuildJob
    displayName: 'Build Docker Image'
    
    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - task: DockerInstaller@0
      inputs:
        dockerVersion: '28.4.0'
        
    # VERSÃO NOVA (A SOLUÇÃO)
    - task: Bash@3
      displayName: 'Set up QEMU and Docker Buildx'
      inputs:
        targetType: 'inline'
        script: |
          sudo docker run --rm --privileged tonistiigi/binfmt --install all
          echo "QEMU binfmt handlers installed."
          sudo docker buildx create --use
          echo "Docker Buildx builder created and activated."

    - task: Docker@2
      displayName: 'DockerLogin'
      inputs:
        containerRegistry: 'docker-account-bralmeida'
        command: 'login'

    - task: Bash@3
      displayName: 'Build multi-arch image with Buildx'
      inputs:
        targetType: 'inline'
        script: |
          echo "Iniciando build para múltiplas arquiteturas..."
          sudo docker buildx version

          sudo docker buildx build \
            --platform linux/arm64 \
            --tag '$(imageRepository):$(dockerImageLatestTag)' \
            --file $(dockerfilePath) \
            --cache-from "type=registry,ref=$(imageRepository):cache" \
            --cache-to "type=registry,ref=$(imageRepository):cache,mode=max" \
            --push .
          
          sudo docker image ls
          #sudo docker logout

    # - task: Docker@2
    #   displayName: 'Docker Push'
    #   inputs:
    #     containerRegistry: 'docker-account-bralmeida'
    #     repository: $(imageRepository)
    #     command: 'push'
    #     tags: |
    #       $(dockerImageLatestTag)

    - task: Docker@2
      displayName: 'DockerLogOut'
      inputs:
        containerRegistry: 'docker-account-bralmeida'
        command: 'logout'

- stage: Deploy
  displayName: 'Deploy to OCI VM'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: DeployToOCI
    displayName: 'Deploy to OCI VM'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:          
          - task: InstallSSHKey@0
            displayName: 'Install SSH key'
            inputs:
              knownHostsEntry: '$(OCI_VM_IP) $(OCI_SSH_HOST_KEY)'
              sshPublicKey: '$(OCI_SSH_PUBLIC_KEY)'
              sshKeySecureFile: 'OCI_VM_SSH_KEY.key'

          - task: Bash@3
            displayName: 'Deploy to OCI VM'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                
                echo "🚀 Starting deployment to OCI VM..."
                
                # Copy files to OCI VM
                #echo "📦 Copying files to OCI VM..."
                scp -o StrictHostKeyChecking=no -r $(System.DefaultWorkingDirectory)/* $(OCI_VM_USER)@$(OCI_VM_IP):$(deploymentPath)/
                
                # Execute deployment script on OCI VM
                echo "🔧 Executing deployment on OCI VM..."
                ssh -o StrictHostKeyChecking=no $(OCI_VM_USER)@$(OCI_VM_IP) << 'EOF'
                  set -e
                  cd $(deploymentPath)
                  
                  echo "🛑 Stopping existing containers..."
                  sudo docker compose down || true
                  
                  echo "🗑️ Cleaning up old images..."
                  sudo docker system prune -f
                  
                  echo "📥 Loading new Docker image..."
                  sudo docker compose pull

                  echo "Deleting image file"
                  
                  echo "🔧 Setting up environment..."
                  # Create .env file with secrets
                  cat > .env << EOL
                BINANCE_API_KEY=$(BINANCE_API_KEY)
                BINANCE_API_SECRET=$(BINANCE_API_SECRET)
                ENVIRONMENT=production
                BUILD_ID=$(Build.BuildId)
                EOL
                  
                  echo "🚀 Starting new containers..."
                  sudo docker compose up -d
                  
                  echo "⏳ Waiting for services to start..."
                  sleep 30

                  echo "Look the running containers"
                  sudo docker compose ps
                  
                  echo "🔍 Checking service health..."
                  curl -f http://localhost:8000/api/health ||# exit 1
                  
                  echo "✅ Deployment completed successfully!"
                  
                EOF
                
                echo "🎉 Deployment to OCI VM completed!"

          - task: Bash@3
            displayName: 'Verify deployment'
            inputs:
              targetType: 'inline'
              script: |
                echo "🔍 Verifying deployment..."
                
                # Test API endpoint
                response=$(curl -s -o /dev/null -w "%{http_code}" http://$(OCI_VM_IP):8000/api/health)
                
                if [ $response -eq 200 ]; then
                  echo "✅ API health check passed"
                else
                  echo "❌ API health check failed (HTTP $response)"
                  exit 1
                fi
                
                # Test dashboard
                response=$(curl -s -o /dev/null -w "%{http_code}" http://$(OCI_VM_IP):8000/)
                
                if [ $response -eq 200 ]; then
                  echo "✅ Dashboard is accessible"
                else
                  echo "❌ Dashboard is not accessible (HTTP $response)"
                  exit 1
                fi
                
                echo "🎉 All verification checks passed!"
                echo "📊 Dashboard URL: http://$(OCI_VM_IP):8000"

- stage: Rollback
  displayName: 'Rollback (Manual)'
  dependsOn: Deploy
  condition: failed()

  jobs:
  - job: RollbackJob
    displayName: 'Rollback to Previous Version'
    steps:
    - task: Bash@3
      displayName: 'Rollback deployment'
      inputs:
        targetType: 'inline'
        script: |
          echo "🔄 Starting rollback process..."
          
          ssh -o StrictHostKeyChecking=no $(OCI_VM_USER)@$(OCI_VM_IP) << 'EOF'
            set -e
            cd $(deploymentPath)
            
            echo "🛑 Stopping current containers..."
            sudo docker compose down
            
            echo "🔄 Rolling back to previous image..."
            sudo docker tag $(dockerImageName):previous $(dockerImageName):latest
            
            echo "🚀 Starting previous version..."
            sudo docker compose up -d
            
            echo "✅ Rollback completed!"
          EOF